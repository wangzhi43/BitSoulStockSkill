name: Package BitSoulStockSkill

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: bash tools/package_on_linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitSoulStockSkill
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
