name: Package BitSoulStockSkill

on:
  workflow_dispatch:
    inputs:
      minify:
        description: '是否加密Python源码'
        type: boolean
        default: false

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        run: bash tools/package_on_mac.sh
        env:
          MINIFY: ${{ inputs.minify }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7
